name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - dev

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: linux
            goarch: s390x
          - goos: linux
            goarch: arm64

    name: Build artifacts
    runs-on: ubuntu-latest
    container:
      image: goreleaser/goreleaser-cross:v1.25
    steps:
      - run: |
          apt update && apt install unzip curl -y
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          chmod +x /usr/bin/yq

      - run: git config --global --add safe.directory /__w/nezha/nezha

      - uses: actions/checkout@v4

      - name: Prepare frontends' dists
        run: |
          chmod +x ./script/fetch-frontends.sh && ./script/fetch-frontends.sh

      - name: Fetch IPInfo GeoIP Database
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          rm -f pkg/geoip/geoip.db
          if [ -n "$IPINFO_TOKEN" ]; then
            wget -qO pkg/geoip/geoip.db https://ipinfo.io/data/free/country.mmdb?token=${IPINFO_TOKEN} || echo "Warning: Failed to fetch GeoIP database"
          else
            echo "Warning: IPINFO_TOKEN not set, skipping GeoIP database download"
            touch pkg/geoip/geoip.db
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: generate swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init --pd -d cmd/dashboard -g main.go -o cmd/dashboard/docs

      - name: Cache zstd for armv7l
        if: matrix.goarch == 'arm'
        id: cache-zstd
        uses: actions/cache@v4
        with:
          path: /tmp/zstd-arm
          key: zstd-arm-v1.5.7
      - name: Build zstd for armv7l
        if: matrix.goarch == 'arm'
        run: |
          go mod vendor
          if [ -f /tmp/zstd-arm/libzstd.a ]; then
            echo "Using cached libzstd.a"
          else
            ZSTD_VERSION=v1.5.7
            git clone --depth 1 --branch ${ZSTD_VERSION} https://github.com/facebook/zstd /tmp/zstd
            cd /tmp/zstd/lib
            CC=arm-linux-gnueabihf-gcc \
              CXX=arm-linux-gnueabihf-g++ \
              AR=arm-linux-gnueabihf-ar \
              CFLAGS="-mfloat-abi=hard -mfpu=vfpv3-d16" \
              ZSTD_LEGACY_SUPPORT=0 \
              make clean libzstd.a
            mkdir -p /tmp/zstd-arm
            cp libzstd.a /tmp/zstd-arm/libzstd.a
          fi
          GOZSTD_VENDOR=${GITHUB_WORKSPACE}/vendor/github.com/valyala/gozstd
          cp /tmp/zstd-arm/libzstd.a ${GOZSTD_VENDOR}/libzstd_linux_arm.a
          printf '//go:build linux && arm\n\npackage gozstd\n\n/*\n#cgo LDFLAGS: ${SRCDIR}/libzstd_linux_arm.a\n*/\nimport "C"\n' > ${GOZSTD_VENDOR}/libzstd_linux_arm.go

      - name: Build with tag
        if: contains(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v6
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --single-target --clean --skip=validate

      - name: Build snapshot
        if: contains(github.ref, 'refs/tags/') == false
        uses: goreleaser/goreleaser-action@v6
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --single-target --clean --skip=validate --snapshot

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('-v{0}', matrix.goarm) || '' }}
          path: |
            ./dist/*/*

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    needs: build
    name: Release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./assets

      - name: Archive and compress binaries
        run: |
          mkdir -p ./final_assets
          find assets/ -type f -name "dashboard-*" | while read -r file; do
            filename=$(basename "$file")
            if [[ "$filename" == *"arm"* ]]; then
              targetName="dashboard-linux-armv7l.zip"
            else
              fileWithoutExt="${filename%.*}"
              targetName="$fileWithoutExt.zip"
            fi
            zip -jr "./final_assets/$targetName" "$file"
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: "final_assets/*.zip"
          generate_release_notes: true
          allowUpdates: true

      - name: Purge jsdelivr cache
        run: |
          curl -s https://purge.jsdelivr.net/gh/${{ github.repository_owner }}/nezha@master/script/install.sh
          curl -s https://purge.jsdelivr.net/gh/${{ github.repository_owner }}/nezha@master/script/nezha-agent.service
          curl -s https://purge.jsdelivr.net/gh/${{ github.repository_owner }}/nezha@master/script/docker-compose.yaml
          curl -s https://purge.jsdelivr.net/gh/${{ github.repository_owner }}/nezha@master/script/config.yaml
          LOWER_USERNAME=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          curl -s https://purge.jsdelivr.net/gh/$LOWER_USERNAME/nezha@master/script/install.sh
          curl -s https://purge.jsdelivr.net/gh/$LOWER_USERNAME/nezha@master/script/nezha-agent.service
          curl -s https://purge.jsdelivr.net/gh/$LOWER_USERNAME/nezha@master/script/docker-compose.yaml
          curl -s https://purge.jsdelivr.net/gh/$LOWER_USERNAME/nezha@master/script/config.yaml
